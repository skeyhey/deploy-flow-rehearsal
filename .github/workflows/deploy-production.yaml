name: Deploy To Production
on:
  workflow_dispatch:
    inputs:
      skip-preprod-and-smoke-tests:
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
concurrency:
  group: deploy-production
permissions:
  actions: write
  contents: read
jobs:
  deploy-preproduction:
    if: ${{ !inputs.skip-preprod-and-smoke-tests }}
    runs-on: ubuntu-latest
    environment: preproduction
    steps:
      - name: Stop any develop deploy of preproduction
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The release owns preproduction from here on. Cancel rather than wait: the develop
          # workflow waits for this run, so a mutual wait would deadlock for 60 minutes.
          # Cancel failures are tolerated; the loop below is the real gate.
          active_ids() {
            gh run list --workflow deploy-preproduction.yaml --limit 20 \
              --json databaseId,status --jq '.[] | select(.status != "completed") | .databaseId'
          }

          for id in $(active_ids); do
            gh run cancel "$id" && echo "Cancelled develop deploy run $id" \
              || echo "Could not cancel run $id yet, will retry and escalate."
          done

          for attempt in $(seq 1 20); do
            active=$(active_ids | wc -l | tr -d ' ') || active=unknown

            if [[ "$active" == "0" ]]; then
              echo "No develop deploy active, deploying."
              exit 0
            fi

            if (( attempt % 4 == 0 )); then
              # A minute without effect: a plain cancel can be refused for a run stuck
              # between states, force-cancel is not.
              for id in $(active_ids); do
                gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" \
                  && echo "Force-cancelled run $id" || echo "Force-cancel of run $id refused."
              done
            fi

            echo "$active develop deploy run(s) still active, waiting (attempt $attempt/20)..."
            sleep 15
          done

          echo "A develop deploy is still active after 5 minutes, giving up." >&2
          exit 1
      - run: |
          echo "PREPROD deploy (release) ref=$GITHUB_REF sha=$GITHUB_SHA start=$(date -u +%T)"
          sleep 120
          echo "PREPROD deploy (release) end=$(date -u +%T)"
  test-e2e-smoke:
    needs: deploy-preproduction
    if: ${{ !inputs.skip-preprod-and-smoke-tests }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "SMOKE start=$(date -u +%T)"; sleep 30; echo "SMOKE end=$(date -u +%T)"
  deploy-production:
    needs: [deploy-preproduction, test-e2e-smoke]
    if: ${{ always() && (needs.deploy-preproduction.result == 'success' || needs.deploy-preproduction.result == 'skipped') && (needs.test-e2e-smoke.result == 'success' || needs.test-e2e-smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "PRODUCTION deploy ref=$GITHUB_REF sha=$GITHUB_SHA at=$(date -u +%T)"
